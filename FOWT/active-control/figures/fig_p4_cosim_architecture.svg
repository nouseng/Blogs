<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 725" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="730" height="725" fill="#ffffff"/>

  <!-- Python loop boundary: a staple/C shape wrapping the FMU on 3 sides,
       so Mooring (top) and PitchController (bottom) read as "in Python"
       while the FMU itself stays clearly outside the boundary. -->
  <path d="M25,10 L705,10 L705,180 L430,180 L430,510 L705,510 L705,690 L25,690 Z"
        fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="47" y="32" font-size="14" fill="#555">Python: public/helpers.py + public/controller.py -- run_cosim()</text>

  <!-- Mooring resolution: directly above the FMU -->
  <rect x="445" y="20" width="220" height="110" rx="6" fill="#eafbea" stroke="#2ca02c" stroke-width="1.5"/>
  <text x="555" y="57" font-size="13" text-anchor="middle" fill="#111">Mooring resolution</text>
  <text x="555" y="75" font-size="11" text-anchor="middle" fill="#555">public/helpers.py</text>
  <text x="555" y="93" font-size="10" text-anchor="middle" fill="#777">CatenaryMooring / OnnxMooring</text>

  <!-- WindModel -->
  <rect x="60" y="250" width="220" height="90" rx="6" fill="#eaf2fb" stroke="#1f77b4" stroke-width="1.5"/>
  <text x="170" y="286" font-size="13" text-anchor="middle" fill="#111">WindModel</text>
  <text x="170" y="304" font-size="11" text-anchor="middle" fill="#555">public/helpers.py</text>

  <!-- WaveModel -->
  <rect x="90" y="390" width="220" height="110" rx="6" fill="#eaf2fb" stroke="#1f77b4" stroke-width="1.5"/>
  <text x="200" y="427" font-size="13" text-anchor="middle" fill="#111">WaveModel + loads</text>
  <text x="200" y="445" font-size="11" text-anchor="middle" fill="#555">public/helpers.py</text>
  <text x="200" y="463" font-size="10" text-anchor="middle" fill="#777">produces f_wave, m_wave</text>

  <!-- PitchController: directly below the FMU -->
  <rect x="445" y="560" width="220" height="110" rx="6" fill="#fdeee9" stroke="#c0392b" stroke-width="1.5"/>
  <text x="555" y="597" font-size="13" text-anchor="middle" fill="#111">PitchController</text>
  <text x="555" y="615" font-size="11" text-anchor="middle" fill="#555">public/controller.py</text>
  <text x="555" y="633" font-size="10" text-anchor="middle" fill="#777">fixed schedule + rate feedback</text>

  <!-- FMU -->
  <rect x="440" y="190" width="230" height="310" rx="10" fill="#f5f0fb" stroke="#6a3d9a" stroke-width="2.5"/>
  <rect x="447" y="197" width="216" height="296" rx="8" fill="none" stroke="#6a3d9a" stroke-width="1"/>
  <text x="555" y="318" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">FOWT.fmu</text>
  <text x="555" y="336" font-size="11" text-anchor="middle" fill="#555">FMI2 slave (FMPy)</text>
  <text x="555" y="354" font-size="11" text-anchor="middle" fill="#555">compiled from FOWT.mo</text>
  <text x="555" y="372" font-size="10" text-anchor="middle" fill="#777">the only non-Python piece</text>

  <!-- Mooring <-> FMU: straight vertical drops -->
  <path d="M490,130 L490,190" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="482" y="163" font-size="9.5" text-anchor="end" fill="#333">forceML1/2/3[1..3]</text>
  <path d="M620,190 L620,130" fill="none" stroke="#333" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="628" y="163" font-size="9.5" text-anchor="start" fill="#555">motion (step i-1)</text>

  <!-- WindModel -> FMU: straight horizontal -->
  <path d="M280,295 L440,295" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="360" y="289" font-size="9" text-anchor="middle" fill="#333">windSpeed(t)</text>

  <!-- WaveModel -> FMU: straight horizontals -->
  <path d="M310,415 L440,415" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="375" y="409" font-size="9" text-anchor="middle" fill="#333">waveForces[1..3]</text>
  <path d="M310,475 L440,475" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="375" y="469" font-size="9" text-anchor="middle" fill="#333">waveMoments[1..3]</text>

  <!-- PitchController <-> FMU: straight vertical drops -->
  <path d="M505,560 L505,500" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="497" y="533" font-size="9.5" text-anchor="end" fill="#333">pitchCollective = phi_ref</text>
  <path d="M605,500 L605,560" fill="none" stroke="#333" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="613" y="533" font-size="9.5" text-anchor="start" fill="#555">pitch (step i-1)</text>

  <text x="365" y="707" font-size="11" text-anchor="middle" fill="#777">One step behind on purpose: the controller and mooring both read motion outputs from step i-1 (Jacobi-type coupling).</text>
</svg>
