<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1220" height="460" fill="#ffffff"/>

  <!-- fixed base pitch: computed once per run, feeds off directly and feedforward into the sum -->
  <circle cx="40" cy="75" r="4" fill="#1f77b4"/>
  <text x="55" y="69" font-size="12" fill="#111">base wind speed</text>
  <text x="55" y="84" font-size="12" fill="#111">(fixed per run)</text>

  <rect x="150" y="45" width="220" height="60" rx="6" fill="#eaf2fb" stroke="#1f77b4" stroke-width="1.5"/>
  <text x="260" y="70" font-size="12.5" text-anchor="middle" fill="#111">pitch_schedule(base_wind_speed)</text>
  <text x="260" y="88" font-size="10.5" text-anchor="middle" fill="#555">NREL table, once per run</text>

  <path d="M44,75 L150,75" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M370,75 L440,75" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="440" y="55" width="120" height="40" rx="18" fill="#fff" stroke="#1f77b4" stroke-width="1.5"/>
  <text x="500" y="80" font-size="12.5" text-anchor="middle" fill="#111">off: phi_ref</text>

  <!-- same base_pitch feeds the sum as a constant feedforward -->
  <path d="M260,105 L260,150 L772,150" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="330" y="140" font-size="10" fill="#777">feedforward (constant, = off)</text>

  <!-- live wind speed drives only the fl_kp gain schedule now, not the feedforward -->
  <circle cx="40" cy="210" r="4" fill="#1f77b4"/>
  <text x="55" y="204" font-size="12" fill="#111">wind speed</text>
  <text x="55" y="219" font-size="12" fill="#111">V(t) (live)</text>

  <path d="M44,210 L150,210" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="150" y="180" width="220" height="60" rx="6" fill="#eaf2fb" stroke="#1f77b4" stroke-width="1.5"/>
  <text x="260" y="205" font-size="12.5" text-anchor="middle" fill="#111">Low-pass filter</text>
  <text x="260" y="223" font-size="10.5" text-anchor="middle" fill="#555">T = 2.0 s</text>

  <!-- fl_kp schedule branch -->
  <path d="M370,210 L405,210 L405,290 L440,290" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="405" y="255" font-size="10" text-anchor="middle" fill="#777">V_filtered</text>
  <rect x="440" y="270" width="220" height="60" rx="6" fill="#fdf3e3" stroke="#e6a817" stroke-width="1.5"/>
  <text x="550" y="295" font-size="12.5" text-anchor="middle" fill="#111">fl_kp schedule</text>
  <text x="550" y="313" font-size="10.5" text-anchor="middle" fill="#555">wind-speed lookup, flat 40</text>

  <!-- derivative / rate feedback chain -->
  <circle cx="40" cy="390" r="4" fill="#c0392b"/>
  <text x="55" y="384" font-size="12" fill="#111">platform_pitch</text>
  <text x="55" y="399" font-size="12" fill="#111">(measured)</text>

  <path d="M44,390 L150,390" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="150" y="360" width="220" height="60" rx="6" fill="#fdeee9" stroke="#c0392b" stroke-width="1.5"/>
  <text x="260" y="385" font-size="12.5" text-anchor="middle" fill="#111">Derivative + filter</text>
  <text x="260" y="403" font-size="10.5" text-anchor="middle" fill="#555">T = 0.1 s (band-limited)</text>

  <path d="M370,390 L790,390 L790,318" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="580" y="405" font-size="10" fill="#777">filtered_rate</text>

  <!-- multiply: fl_kp x filtered_rate -->
  <circle cx="790" cy="300" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="790" y="306" font-size="15" text-anchor="middle" fill="#111">&#215;</text>
  <path d="M660,300 L772,300" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M790,282 L790,168" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="815" y="235" font-size="10" fill="#777">feedback term</text>

  <!-- sum: feedforward + feedback -->
  <circle cx="790" cy="150" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="790" y="156" font-size="16" text-anchor="middle" fill="#111">+</text>

  <path d="M808,150 L870,150" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="870" y="120" width="150" height="60" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="1.5"/>
  <text x="945" y="145" font-size="12.5" text-anchor="middle" fill="#111">Saturate</text>
  <text x="945" y="163" font-size="10.5" text-anchor="middle" fill="#555">[0, &#960;/2]</text>

  <path d="M1020,150 L1060,150" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>

  <rect x="1060" y="130" width="130" height="40" rx="18" fill="#fff" stroke="#1f77b4" stroke-width="1.5"/>
  <text x="1125" y="155" font-size="12.5" text-anchor="middle" fill="#111">pi: phi_ref</text>

  <text x="610" y="440" font-size="11" text-anchor="middle" fill="#777">pi = full sum, saturated. off skips the filter/sum/saturate entirely -- it's the raw constant base_pitch. Both feed the FMU's own actuator model (Blades.mo: 8 deg/s rate limit + 2 Hz filter), not modelled in Python.</text>
</svg>
