services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
        - CMD-SHELL
        - "rpk cluster health |
          grep -q 'Healthy:.*true'"
      interval: 5s
      timeout: 5s
      retries: 20

  questdb:
    image: questdb/questdb:10.0.0
    ports:
      - "9000:9000"
    volumes:
      - questdb-data:/var/lib/questdb

  gateway:
    build: .
    command: python -m gateway.server
    ports:
      - "5020:5020"

  orchestrator:
    build: .
    command: python -m orchestrator.main
    environment:
      GATEWAY_HOST: gateway
      GATEWAY_PORT: "5020"
      SIM_SPEED_K: "6.0"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TICK_TOPIC: dc2dh.plant-ticks.v1
      LIVE_FEEDS: "${LIVE_FEEDS:-0}"
      PRICE_FEED_URL: "${PRICE_FEED_URL:-}"
      PRICE_FEED_FIELD: "${PRICE_FEED_FIELD:-price_eur_mwh}"
      PRICE_FEED_TOKEN: "${PRICE_FEED_TOKEN:-}"
      RUN_ID: "${RUN_ID:-}"
    depends_on:
      gateway:
        condition: service_started
      redpanda:
        condition: service_healthy

  questdb-sink:
    build: .
    command: python -m sink.questdb_sink
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TICK_TOPIC: dc2dh.plant-ticks.v1
      QUESTDB_HTTP_URL: http://questdb:9000
    depends_on:
      redpanda:
        condition: service_healthy
      questdb:
        condition: service_started

  console:
    build: .
    command: python -m console.app
    environment:
      GATEWAY_HOST: gateway
      GATEWAY_PORT: "5020"
    ports:
      - "8080:8080"
    depends_on:
      - gateway

volumes:
  redpanda-data:
  questdb-data:
