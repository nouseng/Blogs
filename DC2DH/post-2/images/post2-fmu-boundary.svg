<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 610" width="1300" height="610" role="img" aria-labelledby="title desc">
  <title id="title">How a real digital twin connects a physical plant to a separate gateway, orchestrator and FMU</title>
  <desc id="desc">Physical equipment contains sensors and actuators wired to PLC remote IO. The PLC exposes measurements and commands through a Modbus TCP gateway. A separate orchestrator reads and decodes registers, advances the separate FMU through FMI signals, and publishes results. Calibration compares measured plant values with FMU predictions. An operator HMI reads measurements and writes commands through the gateway.</desc>
  <style>
    .bg{fill:#fff}
    .title{font:600 24px "Segoe UI",Inter,sans-serif;fill:#1a1a1a}
    .head{font:600 17px "Segoe UI",Inter,sans-serif;fill:#1a1a1a}
    .text{font:15px "Segoe UI",Inter,sans-serif;fill:#2e2e2e}
    .small{font:14px "Segoe UI",Inter,sans-serif;fill:#555555}
    .tiny{font:13px "Segoe UI",Inter,sans-serif;fill:#5f5f5f}
    .panel{fill:#f6f4f0;stroke:#d8d2c8;stroke-width:1.4}
    .blue{fill:#eaf1f8;stroke:#4a7fb5;stroke-width:1.5}
    .green{fill:#eef5ee;stroke:#9dbf9d;stroke-width:1.4}
    .line{fill:none;stroke:#4a7fb5;stroke-width:2}
    .grey{fill:none;stroke:#8a8378;stroke-width:1.9}
    .thin{fill:none;stroke:#b2aba1;stroke-width:1.5}
  </style>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0.5L9.5 5L0 9.5z" fill="#4a7fb5"/></marker>
    <marker id="grey-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0.5L9.5 5L0 9.5z" fill="#8a8378"/></marker>
  </defs>

  <rect class="bg" width="1300" height="610"/>
  <text class="title" x="28" y="40">How a real plant is wired to the FMU</text>

  <rect class="green" x="538" y="54" width="244" height="62" rx="6"/>
  <text class="head" x="660" y="80" text-anchor="middle">Operator HMI / controller</text>
  <text class="small" x="660" y="103" text-anchor="middle">read values · write commands</text>

  <rect class="green" x="28" y="146" width="204" height="210" rx="7"/>
  <text class="head" x="44" y="175">Physical plant</text>
  <text class="text" x="44" y="201">Data hall · heat pump</text>
  <text class="text" x="44" y="223">tank · cooler · pumps</text>
  <rect class="panel" x="42" y="238" width="176" height="48" rx="4"/>
  <text class="small" x="54" y="259">Sensors: temperature</text>
  <text class="small" x="54" y="278">heat · power</text>
  <rect class="panel" x="42" y="294" width="176" height="48" rx="4"/>
  <text class="small" x="54" y="315">Actuators: compressor</text>
  <text class="small" x="54" y="334">valves · fans</text>

  <rect class="panel" x="308" y="146" width="186" height="210" rx="7"/>
  <text class="head" x="324" y="175">PLC / remote I/O</text>
  <text class="text" x="324" y="204">Read field signals</text>
  <text class="text" x="324" y="228">Scale to eng. units</text>
  <text class="text" x="324" y="252">Drive actuators</text>
  <text class="small" x="324" y="300">RTD · 4–20 mA · pulse</text>
  <text class="small" x="324" y="321">digital I/O · fieldbus</text>

  <rect class="blue" x="556" y="146" width="208" height="210" rx="7"/>
  <text class="head" x="572" y="175">Modbus TCP gateway</text>
  <text class="text" x="572" y="204">Measurement registers</text>
  <text class="small" x="572" y="225">scaled sensor values</text>
  <text class="text" x="572" y="256">Command registers</text>
  <text class="small" x="572" y="277">setpoints and modes</text>
  <text class="small" x="572" y="306">Integer values</text>
  <text class="small" x="572" y="325">over Ethernet</text>

  <rect class="panel" x="828" y="146" width="198" height="210" rx="7"/>
  <text class="head" x="844" y="175">Orchestrator</text>
  <text class="text" x="844" y="204">Read &amp; decode registers</text>
  <text class="text" x="844" y="228">Set FMU inputs</text>
  <text class="text" x="844" y="252">Advance model time</text>
  <text class="text" x="844" y="276">Publish FMU outputs</text>
  <text class="small" x="844" y="306">Owns communication</text>
  <text class="small" x="844" y="325">and timing</text>

  <rect class="blue" x="1076" y="146" width="196" height="210" rx="7"/>
  <text class="head" x="1092" y="175">StockholmPod.fmu</text>
  <text class="text" x="1092" y="204">Physics equations</text>
  <text class="text" x="1092" y="228">Numerical solver</text>
  <text class="text" x="1092" y="252">Thermal state</text>
  <text class="text" x="1092" y="276">Predicted outputs</text>
  <text class="small" x="1092" y="306">The model, not</text>
  <text class="small" x="1092" y="325">the network layer</text>

  <path class="grey" d="M234 242H306" marker-start="url(#grey-arrow)" marker-end="url(#grey-arrow)"/>
  <text class="tiny" x="270" y="228" text-anchor="middle">field wiring</text>
  <path class="line" d="M496 242H554" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <text class="tiny" x="525" y="228" text-anchor="middle">Ethernet</text>
  <path class="line" d="M766 242H826" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <text class="tiny" x="796" y="228" text-anchor="middle">registers</text>
  <path class="line" d="M1028 242H1074" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <text class="tiny" x="1051" y="228" text-anchor="middle">FMI</text>
  <path class="line" d="M660 118V144" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>

  <text class="head" x="28" y="394">One sensor reading</text>
  <rect class="panel" x="28" y="410" width="204" height="78" rx="5"/>
  <text class="text" x="46" y="438">Tank RTD</text>
  <text class="small" x="46" y="463">physical temperature</text>
  <rect class="panel" x="270" y="410" width="214" height="78" rx="5"/>
  <text class="text" x="288" y="438">PLC input + scaling</text>
  <text class="small" x="288" y="463">75.00 °C → raw 7500</text>
  <rect class="blue" x="522" y="410" width="214" height="78" rx="5"/>
  <text class="text" x="540" y="438">Measurement register</text>
  <text class="small" x="540" y="463">served over Modbus TCP</text>
  <rect class="panel" x="774" y="410" width="214" height="78" rx="5"/>
  <text class="text" x="792" y="438">Orchestrator</text>
  <text class="small" x="792" y="463">decode engineering value</text>
  <rect class="blue" x="1026" y="410" width="246" height="78" rx="5"/>
  <text class="text" x="1044" y="434">FMU + calibration</text>
  <text class="small" x="1044" y="455">measured tank °C ↔</text>
  <text class="small" x="1044" y="474">FMU T_tank_top prediction</text>
  <path class="thin" d="M232 449H268" marker-end="url(#grey-arrow)"/>
  <path class="thin" d="M484 449H520" marker-end="url(#grey-arrow)"/>
  <path class="thin" d="M736 449H772" marker-end="url(#grey-arrow)"/>
  <path class="thin" d="M988 449H1024" marker-end="url(#grey-arrow)"/>

  <text class="head" x="28" y="522">One actuator command</text>
  <text class="text" x="28" y="548">HMI/controller → gateway command register → PLC output → heat pump, valve, pump or fan</text>

  <text class="tiny" x="28" y="576">Measured and FMU-predicted values remain separate for calibration.</text>
  <text class="tiny" x="28" y="595">Post 2 implements the HMI, gateway, orchestrator and FMU; it does not connect the physical plant or PLC.</text>
</svg>
