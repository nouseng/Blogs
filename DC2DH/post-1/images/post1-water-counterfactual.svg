<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="tB dB">
  <title id="tB">What cooling the same 10 MW pod costs in water</title>
  <desc id="dB">Three columns: a hot, dry site that cools by evaporating water uses roughly 130 million litres a year; Stockholm uses 0 litres on site because fans cool the pod all year; that 130 million litres splits into about 73 million litres a year for heat sold to the network and about 58 million litres a year for heat the fans reject.</desc>
  <style>
    .bg{fill:#ffffff}
    .h{font:600 19px "Segoe UI",Inter,sans-serif;fill:#1a1a1a}
    .col{font:600 15px "Segoe UI",Inter,sans-serif;fill:#1a1a1a}
    .big{font:700 24px "Segoe UI",Inter,sans-serif;fill:#1a1a1a}
    .sub{font:12px "Segoe UI",Inter,sans-serif;fill:#5a5a5a}
    .foot{font:12px "Segoe UI",Inter,sans-serif;fill:#5a5a5a}
    .panel{fill:#f6f4f0;stroke:#d8d2c8;stroke-width:1}
    .win{fill:#eef5ee;stroke:#9dbf9d;stroke-width:1}
  </style>
  <rect class="bg" x="0" y="0" width="900" height="430"/>
  <text class="h" x="40" y="42">Cooling the same 10 MW pod: what it costs in water</text>

  <rect class="panel" x="40"  y="64" width="256" height="250" rx="6"/>
  <rect class="panel" x="322" y="64" width="256" height="250" rx="6"/>
  <rect class="win"   x="604" y="64" width="256" height="250" rx="6"/>

  <text class="col" x="60"  y="92">Hot, dry site</text>
  <text class="sub" x="60"  y="110">cooled by evaporating water</text>
  <text class="col" x="342" y="92">Stockholm</text>
  <text class="sub" x="342" y="110">cooled by fans (dry cooler)</text>
  <text class="col" x="624" y="92">Where the water goes</text>
  <text class="sub" x="624" y="110">the same ~130 million L/yr, split</text>

  <g transform="translate(60,128)">
    <path d="M28 0 C28 0 56 32 56 48 A28 28 0 1 1 0 48 C0 32 28 0 28 0 Z" fill="#4a7fb5"/>
  </g>
  <g transform="translate(342,128)">
    <path d="M28 0 C28 0 56 32 56 48 A28 28 0 1 1 0 48 C0 32 28 0 28 0 Z" fill="none" stroke="#b8b2a8" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <g transform="translate(624,128)">
    <path d="M28 0 C28 0 56 32 56 48 A28 28 0 1 1 0 48 C0 32 28 0 28 0 Z" fill="none" stroke="#b8b2a8" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <text class="big" x="60"  y="238">~130 million L/yr</text>
  <text class="sub" x="60"  y="258">The pod makes 87,600 MWh of heat a</text>
  <text class="sub" x="60"  y="276">year. Evaporating 1 L of water removes</text>
  <text class="sub" x="60"  y="294">about 0.67 kWh, so 1.5 L per kWh.</text>

  <text class="big" x="342" y="238">0 L/yr on site</text>
  <text class="sub" x="342" y="258">The warmest hour of the year is</text>
  <text class="sub" x="342" y="276">30 °C, so fans alone keep the pod</text>
  <text class="sub" x="342" y="294">cool and no water is used.</text>

  <text class="big" x="624" y="230">~73 million L/yr</text>
  <text class="sub" x="624" y="250">48,782 MWh/yr sold as heat</text>
  <text class="sub" x="624" y="268">to the district network</text>
  <text class="sub" x="624" y="286">+ ~58 million L/yr: 38,818 MWh/yr</text>
  <text class="sub" x="624" y="304">the fans throw away</text>

  <text class="foot" x="40" y="344">This is a lower bound. Real cooling towers also lose water to spray and flushing. A published estimate (Mytton, 25.5 million L/yr per MW)</text>
  <text class="foot" x="40" y="362">gives ~255 million L/yr for 10 MW, about twice the figure above.</text>
  <text class="foot" x="40" y="388">Most of the water is used off site: US data centres averaged 0.36 L/kWh on site through 2023, while the power plants making their</text>
  <text class="foot" x="40" y="406">electricity used 4.52 L/kWh, about 12 times as much (LBNL 2024).</text>
</svg>
